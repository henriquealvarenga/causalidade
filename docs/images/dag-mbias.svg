<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Inter, system-ui, sans-serif">
  <!--
    Viés-M (M-bias). Estrutura clínica adaptada de Byeon e Lee (2023, Fig. 9):
    DEP causa ISRS e DAC; TAB causa DAC e câncer de pulmão.
    DAC é colisor — descendente comum de DEP e TAB.
    Não há efeito direto de ISRS sobre câncer de pulmão.
    Ajustar por DAC abre o caminho ISRS ← DEP → DAC ← TAB → CA-PULM.
  -->

  <defs>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8dee9"/>
    </marker>
  </defs>

  <!-- Título -->
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#f0f4f8">Viés-M (M-bias)</text>

  <!--
    Posições dos centros (cx, cy) e elipses (rx=44, ry=24):
      DEP (170, 110), TAB (530, 110)
      DAC (350, 210)
      ISRS (170, 300), CA-PULM (530, 300)
  -->

  <!-- Setas -->
  <!-- DEP → DAC -->
  <line x1="201" y1="127" x2="319" y2="193" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow-m)"/>
  <!-- TAB → DAC -->
  <line x1="499" y1="127" x2="381" y2="193" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow-m)"/>
  <!-- DEP → ISRS -->
  <line x1="170" y1="134" x2="170" y2="276" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow-m)"/>
  <!-- TAB → CA-PULM -->
  <line x1="530" y1="134" x2="530" y2="276" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow-m)"/>

  <!-- Nós -->
  <!-- DEP -->
  <ellipse cx="170" cy="110" rx="44" ry="24" fill="#1c2338" stroke="#a8b3c4" stroke-width="1.5"/>
  <text x="170" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#d8dee9">DEP</text>

  <!-- TAB -->
  <ellipse cx="530" cy="110" rx="44" ry="24" fill="#1c2338" stroke="#a8b3c4" stroke-width="1.5"/>
  <text x="530" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#d8dee9">TAB</text>

  <!-- DAC (colisor) -->
  <ellipse cx="350" cy="210" rx="44" ry="24" fill="#1c2338" stroke="#a78bfa" stroke-width="2"/>
  <text x="350" y="210" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#a78bfa">DAC</text>
  <text x="350" y="248" text-anchor="middle" font-size="11" fill="#a78bfa" font-style="italic">colisor</text>

  <!-- ISRS (exposição) -->
  <ellipse cx="170" cy="300" rx="44" ry="24" fill="#1c2338" stroke="#00d9c0" stroke-width="2"/>
  <text x="170" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#00d9c0">ISRS</text>
  <text x="170" y="340" text-anchor="middle" font-size="11" fill="#00d9c0">exposição</text>

  <!-- CA-PULM (desfecho) -->
  <ellipse cx="530" cy="300" rx="44" ry="24" fill="#1c2338" stroke="#00d9c0" stroke-width="2"/>
  <text x="530" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#00d9c0">CA-PULM</text>
  <text x="530" y="340" text-anchor="middle" font-size="11" fill="#00d9c0">desfecho</text>

  <!-- Caminho viesado quando DAC é ajustada -->
  <text x="350" y="370" text-anchor="middle" font-size="11" fill="#8a96ab" font-style="italic">Ajustar por DAC abre o caminho viesado ISRS ← DEP → DAC ← TAB → CA-PULM.</text>
</svg>
