<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, system-ui, sans-serif">
  <!--
    Três estruturas elementares de DAGs em causalidade:
    cadeia (mediador), garfo (causa comum / confundidor), colisor (efeito comum).
    Recriação didática original.
  -->

  <defs>
    <marker id="arrow-elem" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8dee9"/>
    </marker>
  </defs>

  <!-- Título geral -->
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#f0f4f8">Três estruturas elementares de DAGs</text>

  <!-- Separadores -->
  <line x1="266" y1="55" x2="266" y2="290" stroke="#6b7a90" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="533" y1="55" x2="533" y2="290" stroke="#6b7a90" stroke-width="1.2" stroke-dasharray="5 5"/>

  <!-- Sub-títulos dos painéis -->
  <text x="133" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f4f8">(a) Cadeia</text>
  <text x="400" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f4f8">(b) Garfo</text>
  <text x="666" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f4f8">(c) Colisor</text>

  <!-- ============== Painel (a) Cadeia: X → M → Y ============== -->
  <g>
    <!-- Setas (alinhadas horizontalmente em y=180) -->
    <line x1="62" y1="180" x2="111" y2="180" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow-elem)"/>
    <line x1="155" y1="180" x2="204" y2="180" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow-elem)"/>

    <!-- Nós -->
    <circle cx="40" cy="180" r="22" fill="#1c2338" stroke="#a8b3c4" stroke-width="1.5"/>
    <text x="40" y="180" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#d8dee9">X</text>

    <circle cx="133" cy="180" r="22" fill="#1c2338" stroke="#00d9c0" stroke-width="2"/>
    <text x="133" y="180" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#00d9c0">M</text>

    <circle cx="226" cy="180" r="22" fill="#1c2338" stroke="#a8b3c4" stroke-width="1.5"/>
    <text x="226" y="180" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#d8dee9">Y</text>

    <!-- Legenda do painel -->
    <text x="133" y="240" text-anchor="middle" font-size="12" fill="#a8b3c4">M é mediador.</text>
    <text x="133" y="262" text-anchor="middle" font-size="11" fill="#8a96ab" font-style="italic">Ajustar por M remove parte do efeito.</text>
  </g>

  <!-- ============== Painel (b) Garfo: X ← U → Y ============== -->
  <g>
    <!-- Nós -->
    <circle cx="400" cy="130" r="22" fill="#1c2338" stroke="#00d9c0" stroke-width="2"/>
    <text x="400" y="130" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#00d9c0">U</text>

    <circle cx="335" cy="220" r="22" fill="#1c2338" stroke="#a8b3c4" stroke-width="1.5"/>
    <text x="335" y="220" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#d8dee9">X</text>

    <circle cx="465" cy="220" r="22" fill="#1c2338" stroke="#a8b3c4" stroke-width="1.5"/>
    <text x="465" y="220" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#d8dee9">Y</text>

    <!-- Setas U → X e U → Y (descendentes) -->
    <line x1="387" y1="148" x2="348" y2="202" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow-elem)"/>
    <line x1="413" y1="148" x2="452" y2="202" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow-elem)"/>

    <!-- Legenda do painel -->
    <text x="400" y="265" text-anchor="middle" font-size="12" fill="#a8b3c4">U é causa comum (confundidor).</text>
    <text x="400" y="287" text-anchor="middle" font-size="11" fill="#8a96ab" font-style="italic">Ajustar por U fecha o caminho de porta dos fundos.</text>
  </g>

  <!-- ============== Painel (c) Colisor: X → C ← Y ============== -->
  <g>
    <!-- Nós (X, Y no topo; C no meio-baixo) -->
    <circle cx="601" cy="130" r="22" fill="#1c2338" stroke="#a8b3c4" stroke-width="1.5"/>
    <text x="601" y="130" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#d8dee9">X</text>

    <circle cx="731" cy="130" r="22" fill="#1c2338" stroke="#a8b3c4" stroke-width="1.5"/>
    <text x="731" y="130" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#d8dee9">Y</text>

    <circle cx="666" cy="220" r="22" fill="#1c2338" stroke="#a78bfa" stroke-width="2"/>
    <text x="666" y="220" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#a78bfa">C</text>

    <!-- Setas X → C e Y → C -->
    <line x1="614" y1="148" x2="652" y2="202" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow-elem)"/>
    <line x1="718" y1="148" x2="680" y2="202" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow-elem)"/>

    <!-- Legenda do painel -->
    <text x="666" y="265" text-anchor="middle" font-size="12" fill="#a8b3c4">C é efeito comum (colisor).</text>
    <text x="666" y="287" text-anchor="middle" font-size="11" fill="#8a96ab" font-style="italic">Ajustar por C abre associação espúria.</text>
  </g>
</svg>
